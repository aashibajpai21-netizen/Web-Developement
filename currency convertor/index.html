<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Currency Converter</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container-fluid main-container">

    <!-- Heading -->
    <div class="row">
      <div class="col-12 heading bg-warning text-center p-4 fs-6">
        <h1><b>Currency Converter</b></h1>
      </div>
    </div>

    <!-- Converter Card -->
    <div class="container converter-box border border-3 border-danger mt-4">

      <div class="row align-items-center g-4">

        <!-- From Country -->
        <div class="col-md-5 border border-4 border-danger">
          <div class="country-card text-center ">

            <img
              id="flag1"
              src=""
              alt="flag"
              class="flag"
            />

            <label class="form-label mt-3">From</label>

            <select id="country1" class="form-select">
              <option value="">Select Country</option>
            </select>
          </div>
        </div>

        
        <div class="col-md-2 text-center">

          <button id="swapBtn" class="swap-btn">
            <i class="bi bi-arrow-left-right"></i>
          </button>

        </div>


        <div class="col-md-5">
          <div class="country-card text-center">

            <img
              id="flag2"
              src="india-national-fabric-flag_113767-1933.avif"
              alt="flag"
              class="flag"
            />

            <label class="form-label mt-3">To</label>

            <select id="country2" class="form-select">
              <option value="">Select Country</option>
            </select>
          </div>
        </div>

      </div>

      <!-- Amount -->
      <div class="row mt-4 justify-content-center">

        <div class="col-md-6">

          <input
            type="number"
            id="orgAmount"
            class="form-control amount-input"
            placeholder="Enter Amount"
          />

          <small id="error" class="error-text"></small>

        </div>

      </div>

      <!-- Convert Button -->
      <div class="row mt-4 justify-content-center">

        <div class="col-md-4 d-grid">

          <button id="convertBtn" class="btn btn-primary convert-btn">
            Convert
          </button>

        </div>

      </div>

      <!-- Loading -->
      <div class="row mt-3">
        <div class="col text-center">

          <div id="loading" class="loading-text"></div>

        </div>
      </div>

      <!-- Result -->
      <div class="row mt-4">
        <div class="col text-center">

          <div id="resultBox" class="result-box">

            <h2 id="newAmount">Converted Amount :</h2>

            <p id="rateInfo"></p>

          </div>

        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
