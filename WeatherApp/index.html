    <body class="main1">

   <div class="container weather-container">

    <h1 class="heading">
       Weather Dashboard
    </h1>

    <!-- Search Box -->
    <div class="search-box">

      <input
        type="text"
        id="cityName"
        placeholder="Enter City Name"
      />

      <button onclick="getWeather()">
        Search
      </button>

    </div>

    <!-- Weather Card -->
    <div class="weather-card bg-gradient">

      <h2 id="cityText">
  City, Country
</h2>

<p id="dateText">
  Date
</p>

      <h2 class="city-title">
        Current Temperature
      </h2>

      <div class="temperature-box text-warning">

        <span id="Temperature">30</span>

        <span class="degree">°C</span>

      </div>

    </div>

  </div>


    
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
