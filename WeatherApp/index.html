<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
</head>
<body>
   <body class="main1">

<div class="container weather-container">

    <h1 class="heading">
        AI Weather Intelligence Dashboard
    </h1>

    <!-- Search -->
    <div class="search-box">
        <input
            type="text"
            id="cityName"
            placeholder="Search city..."
        />

        <button onclick="getWeather()">
            <i class="bi bi-search"></i>
        </button>
    </div>

    <!-- Main Weather Card -->
    <div class="weather-card">

        <div class="weather-left">

            <h2 id="cityText">
                City, Country
            </h2>

            <p id="dateText">
                Date
            </p>

            <div class="temperature-box">
                <span id="Temperature">30</span>
                <span class="degree">°C</span>
            </div>

        </div>

        <div class="weather-right">

            <img
                id="weatherIcon"
                src="https://openweathermap.org/img/wn/01d@4x.png"
                alt="weather icon"
            />

        </div>

    </div>

    <!-- Stats Cards -->
    <div class="stats-grid">

        <div class="stat-card">
            <i class="bi bi-droplet-fill"></i>
            <h5>Humidity</h5>
            <span id="humidity">70%</span>
        </div>

        <div class="stat-card">
            <i class="bi bi-wind"></i>
            <h5>Wind</h5>
            <span id="wind">10 km/h</span>
        </div>

        <div class="stat-card">
            <i class="bi bi-eye-fill"></i>
            <h5>Visibility</h5>
            <span id="visibility">10 km</span>
        </div>

        <div class="stat-card">
            <i class="bi bi-speedometer2"></i>
            <h5>Pressure</h5>
            <span id="pressure">1013 hPa</span>
        </div>

    </div>

    <!-- AI Assistant -->
    <div class="ai-container">

        <h2>🤖 AI Weather Assistant</h2>

        <div class="chat-box" id="chatBox">
            Ask me anything about today's weather...
        </div>

        <div class="quick-actions">

            <button onclick="setQuestion('Can I go jogging today?')">
                🏃 Jogging
            </button>

            <button onclick="setQuestion('Should I carry an umbrella?')">
                ☂️ Umbrella
            </button>

            <button onclick="setQuestion('What clothes should I wear?')">
                👕 Clothes
            </button>

            <button onclick="setQuestion('Can I play cricket today?')">
                🏏 Cricket
            </button>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="question"
                placeholder="Ask about today's weather..."
            />

            <button onclick="askAI()">
                Ask AI
            </button>

        </div>

    </div>

</div>


</body>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</body>
</html>
