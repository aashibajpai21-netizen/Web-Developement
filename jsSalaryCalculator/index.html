<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
      <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    
<div class="container d-flex justify-content-center align-items-center vh-100">

        <div class="box bg-white shadow-lg p-4">

            <h2 class="text-center text-primary mb-4">
                Salary Calculator
            </h2>

            <label class="form-label">
                Enter Basic Salary
            </label>

            <input
                type="number"
                id="salary"
                class="form-control"
                placeholder="Enter Basic Salary"
            >

            <small class="text-danger" id="error"></small>

            <div class="mt-4 d-flex gap-3">



<button class="btn btn1 w-50" id="calculate">

                    <span id="btnText">
                        Calculate Gross Salary
                    </span>

                    <span
                        class="spinner-border spinner-border-sm d-none"
                        id="spinner"
                    ></span>

                </button>

                <button class="btn btn2 w-50" id="reset">
                    Reset
                </button>

            </div>

            <div
                class="alert alert-success mt-3 d-none"
                id="success"
            >

             Salary calculated successfully!
            </div>

            <div class="card shadow mt-4">

                <div class="card-header bg-primary text-white">
                    Salary Details
                </div>

                <div class="card-body">

                    <div class="d-flex justify-content-between">
                        <span>Basic Salary</span>
                        <strong id="basicResult">₹0.00</strong>
                    </div>

                    <div class="d-flex justify-content-between mt-3">
                        <span>HRA</span>
                        <strong id="hraResult">₹0.00</strong>
                    </div>

                    <div class="d-flex justify-content-between mt-3">
                        <span>DA</span>
                        <strong id="daResult">₹0.00</strong>
                    </div>

                     <hr>

                    <div class="d-flex justify-content-between fs-5">
                        <span>Gross Salary</span>
                        <strong class="text-success" id="grossResult">
                            ₹0.00
                        </strong>
                    </div>

                </div>

            </div>

        </div>

    </div>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
crossorigin="anonymous">
  
   
</script>
    <script src="script.js"></script>
</body>
</html>
