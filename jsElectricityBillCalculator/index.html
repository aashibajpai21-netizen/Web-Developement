<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
      <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
      <div class="container d-flex justify-content-center align-items-center vh-100">

        <div class="box shadow-lg p-4 bg-white">

            <h2 class="text-center text-danger mb-4">
                Electricity Bill Calculator
            </h2>

            <label class="form-label">
                Enter Electricity Units
            </label>

            <input 
                type="number"
                class="form-control mb-3"
                id="units" placeholder="Enter Units"
            >

            <div class="row">

                <div class="col-6">
                    <button class="btn btn1" id="calculate">
                        Calculate
                    </button>
                </div>

                <div class="col-6">
                    <button class="btn btn2" id="reset">
                        Reset
                    </button>
                </div>

            </div>
            <div class="card shadow-lg mt-4">
    <div class="card-header bg-primary text-white">
        <h3 class="mb-0">Electricity Bill Details</h3>
    </div>

    <div class="card-body">

        <div class="d-flex justify-content-between">
            <span>First 50 Units (0-50)</span>
            <span>50 × ₹0.50 = ₹25.00</span>
        </div>

        <div class="d-flex justify-content-between mt-2">
            <span>Next 150 Units (51-200)</span>
            <span>70 × ₹0.75 = ₹52.50</span>
        </div>

        <div class="d-flex justify-content-between mt-2">
            <span>Next 250 Units (201-450)</span>
            <span>0 × ₹1.20 = ₹0.00</span>
        </div>

        <div class="d-flex justify-content-between mt-2">
            <span>Above 450 Units</span>
            <span>0 × ₹1.50 = ₹0.00</span>
        </div>

        <hr>

        <div class="d-flex justify-content-between">
            <strong>Subtotal</strong>
            <strong></strong>
        </div>

        <div class="d-flex justify-content-between mt-2">
            <strong>Surcharge (20%)</strong>
            <strong></strong>
        </div>

        <hr>

        <div class="d-flex justify-content-between fs-4">
            <strong>Grand Total</strong>
            <strong class="text-success"></strong>
        </div>

    </div>
</div>

               
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
crossorigin="anonymous">
  
   
</script>
    <script src="script.js"></script>
</body>
</html>
